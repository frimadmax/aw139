<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05082a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AW139">
  <title>AW139</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shared/pwa.css">
<link rel="stylesheet" href="assets/ubuntu.css"><link rel="stylesheet" href="shared/omni-theme.css"><link rel="stylesheet" href="shared/tiles.css">
</head>
<body>
  <main class="app-shell">
    <header class="efb-bar">
      <a class="efb-id" href="./" aria-label="AW139 Omni">
        <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-heli"/></svg>
        <span><b>AW139</b><small>Omni <em>Táxi Aéreo</em></small></span>
      </a>
    </header>

    <section class="off-card" id="offCard" data-state="idle" hidden aria-live="polite">
      <div class="off-head">
        <span class="off-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="off-cloud" d="M7 18h10.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.4 8.6 4.75 4.75 0 0 0 7 18z"/><path class="off-arrow" d="M12 9v6m-3-3 3 3 3-3"/><path class="off-check" d="m9 13 2.2 2.2L15.5 11"/></svg></span>
        <div class="off-txt"><b id="offTitle">Preparing offline download</b><small id="offSub">Starting…</small></div>
        <span class="off-pct" id="offPct">0%</span>
      </div>
      <div class="off-track" role="progressbar" aria-label="Offline download"><div class="off-fill" id="offFill"></div></div>
      <button type="button" class="off-retry" id="offRetry" hidden>Download missing files</button>
    </section>

    <section class="flow-section" aria-labelledby="toolsHeading">
      <h2 id="toolsHeading" class="section-kicker">Tools</h2>
      <div class="tile-grid" id="tileGrid">
        <a class="tile tile-key" href="cat-a/" data-search="cat a offshore enhanced clear area vertical short field confined backup decolagem pouso">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-cata"/></svg>
          <span class="tile-label">CAT A</span>
        </a>
        <a class="tile" href="catb/" data-search="cat b">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-catb"/></svg>
          <span class="tile-label">CAT B</span>
        </a>
        <a class="tile" href="power-check/" data-search="power check">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-gauge"/></svg>
          <span class="tile-label">Power Check</span>
        </a>
        <a class="tile" href="wat/" data-search="w.a.t">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-wat"/></svg>
          <span class="tile-label">W.A.T</span>
        </a>
        <a class="tile" href="rto/" data-search="rto">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-rto"/></svg>
          <span class="tile-label">RTO</span>
        </a>
        <a class="tile" href="adc/?back=1&amp;return=../index.html" data-search="adc">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-adc"/></svg>
          <span class="tile-label">ADC</span>
        </a>
        <a class="tile" href="roc/" data-search="roc">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-climb"/></svg>
          <span class="tile-label">ROC</span>
        </a>
        <a class="tile" href="consumo/" data-search="fuel consumption">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-fuel"/></svg>
          <span class="tile-label">Fuel Consumption</span>
        </a>
        <a class="tile" href="teto-pairado/" data-search="hover">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-hover"/></svg>
          <span class="tile-label">Hover</span>
        </a>
        <a class="tile" href="ndl/" data-search="ndl">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-moon"/></svg>
          <span class="tile-label">NDL</span>
        </a>
        <a class="tile" href="limitacoes/" data-search="limits">
          <svg class="aw-icon" aria-hidden="true"><use href="assets/icons.svg#i-limits"/></svg>
          <span class="tile-label">Limits</span>
        </a>
      </div>
    </section>

    <section class="install-panel">
      <button id="installGuideBtn" class="quick-action" type="button">Instalar app</button>
      <p id="installStatusText" class="utility-note">Instale pela Safari para abrir em tela cheia no iPhone e iPad.</p>
    </section>

    <footer class="omni-footer"><span><b>AW139</b> · Performance</span><span>Omni Táxi Aéreo</span></footer>
  </main>


  <script src="shared/pwa.js"></script>
  <script src="shared/home.js"></script>
  <script src="shared/offline-status.js"></script>
</body>
</html>

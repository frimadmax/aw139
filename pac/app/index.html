<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <script>document.write('<base href="'+location.pathname.replace(/[^/]*$/,'')+'">');</script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AW139 Tools and Calculators">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AW139PAC">
  <link rel="apple-touch-icon" href="icons/maskable_icon_x192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AW139 Power Assurance Calculator</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Captured as early as possible — 'beforeinstallprompt' can fire before
    // Flutter's engine has even finished downloading, and it must be
    // preventDefault()-ed synchronously to stash it for a later, deliberate
    // button tap instead of letting the browser show its own mini-infobar.
    // Only Chromium-based browsers (Chrome, Edge, Samsung Internet, Android
    // WebView) fire this at all — iOS Safari has no such API, so there's no
    // way to prompt an install there; users add to Home Screen manually via
    // the Share sheet.
    window.__aw139InstallPrompt = null;

    function aw139NotifyInstallable() {
      window.dispatchEvent(new CustomEvent('aw139-installable-changed', {
        detail: { canInstall: !!window.__aw139InstallPrompt }
      }));
    }

    window.addEventListener('beforeinstallprompt', function (event) {
      // Already running installed (e.g. relaunched from home screen) —
      // nothing to offer.
      if (window.matchMedia('(display-mode: standalone)').matches) return;
      event.preventDefault();
      window.__aw139InstallPrompt = event;
      aw139NotifyInstallable();
    });

    window.addEventListener('appinstalled', function () {
      window.__aw139InstallPrompt = null;
      aw139NotifyInstallable();
    });

    // Returns a Promise<bool> — true if the user accepted the install.
    // Resolves false immediately if there's no stashed prompt to use.
    window.aw139Install = function () {
      var promptEvent = window.__aw139InstallPrompt;
      if (!promptEvent) return Promise.resolve(false);
      window.__aw139InstallPrompt = null;
      aw139NotifyInstallable();
      return promptEvent.prompt()
        .then(function () { return promptEvent.userChoice; })
        .then(function (choice) { return choice.outcome === 'accepted'; })
        .catch(function () { return false; });
    };

    window.aw139CanInstall = function () {
      return !!window.__aw139InstallPrompt;
    };
  </script>
</head>
<body>
  <!-- Shown the instant the page loads, before Flutter's engine/bundle has
       even finished downloading — otherwise the user sees a blank white
       page with zero feedback for however long that takes. Removed on
       'flutter-first-frame', the event Flutter's web engine dispatches on
       window once it actually renders its first real frame. -->
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #ffffff;
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 44px;
      height: 44px;
      border: 5px solid #dbe4ee;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }
    #app-loading span {
      font-family: sans-serif;
      font-size: 14px;
      color: #5f6b7a;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="app-loading">
    <div class="spinner"></div>
    <span>Loading AW139 Tools…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      // sw.js serves everything cache-first, so once installed it never
      // checks the network for a newer version on its own — an installed
      // PWA in particular can go a long time without the browser's own
      // lazy ~24h update check ever firing. This makes the page actively
      // check for (and switch to) a new version instead of relying on
      // users to know they need to force-close and reopen the app.
      //
      // Was this page already being served by an earlier service worker
      // when it loaded? If so, a LATER controllerchange means a genuine
      // update just took over. If not (first-ever install, no previous
      // controller), the initial claim isn't an update to react to, so
      // this only ever reacts for RETURNING users.
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      // Reloading the INSTANT a new version takes over can land mid-use —
      // whatever's typed into a calculator isn't saved anywhere, so that's
      // a real, disruptive loss, not just a flicker. Deferred instead:
      // only reload once the page is hidden (the user switched away/
      // backgrounded it), so it happens invisibly and the app is already
      // fresh by the time they come back. If it's ALREADY hidden when the
      // update lands, nobody's looking either way, so that reloads right
      // away rather than waiting on a hide event that already happened.
      var updateReady = false;
      function reloadForUpdate() {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) {
          hadController = true;
          return;
        }
        if (document.visibilityState === 'hidden') {
          reloadForUpdate();
        } else {
          updateReady = true;
        }
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Force an immediate check for a new sw.js on the server rather
          // than waiting on the browser's own schedule — and again
          // whenever the app becomes visible, which covers reopening an
          // installed PWA from the home screen or app switcher.
          reg.update();
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              reg.update();
            } else if (updateReady) {
              reloadForUpdate();
            }
          });
        });
      });
    }

    // Fix: Android Chrome reclaims the WebGL context when the PWA is backgrounded,
    // causing a black screen on return. Dispatching a resize event forces
    // Flutter/CanvasKit to re-acquire the context and redraw the canvas.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        window.dispatchEvent(new Event('resize'));
      }
    });
  </script>
</body>
</html>

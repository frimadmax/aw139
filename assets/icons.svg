<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Ícones do AW139 Companion: grade 24×24, traço currentColor 1.8, pontas arredondadas. -->
  <symbol id="i-heli" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 4.5h15"/>
      <path d="M11 4.5v3"/>
      <path d="M15.5 7.5H9a4 4 0 0 0-4 4 1.5 1.5 0 0 0 1.5 1.5h9z"/>
      <path d="M15.5 9.5h5.5"/>
      <path d="M21 7.5v4"/>
      <path d="M8.5 13v3M13.5 13v3"/>
      <path d="M6.5 16h9.5"/>
    </g>
  </symbol>

  <symbol id="i-home" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 11 12 3.8l8.5 7.2"/>
      <path d="M6 9v11h12V9"/>
      <path d="M10 20v-5.5h4V20"/>
    </g>
  </symbol>

  <!-- Cat A Clear Area: helicóptero (proa à direita) decolando da pista -->
  <symbol id="i-cata" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(24 0) scale(-1 1) rotate(-10 12 10) translate(0 -1.5)">
        <path d="M3.5 4.5h15"/>
        <path d="M11 4.5v3"/>
        <path d="M15.5 7.5H9a4 4 0 0 0-4 4 1.5 1.5 0 0 0 1.5 1.5h9z"/>
        <path d="M15.5 9.5h5.5"/>
        <path d="M21 7.5v4"/>
        <path d="M8.5 13v3M13.5 13v3"/>
        <path d="M6.5 16h9.5"/>
      </g>
      <path d="M2 21h20"/>
    </g>
  </symbol>

  <!-- Unidade marítima (base comum) -->
  <symbol id="i-rig" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 14h17"/>
      <path d="M7 14v6.5M17 14v6.5"/>
      <path d="M7 17.5h10"/>
      <path d="M2 21.5c1.3-.9 2.7-.9 4 0s2.7.9 4 0 2.7-.9 4 0 2.7.9 4 0 2.7-.9 4 0"/>
    </g>
  </symbol>

  <!-- Decolagem Offshore: UM + seta para cima -->
  <symbol id="i-takeoff" viewBox="0 0 24 24">
    <use href="#i-rig"/>
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 11V2.8"/>
      <path d="M8.5 6.3 12 2.8l3.5 3.5"/>
    </g>
  </symbol>

  <!-- Pouso Offshore: UM + seta para baixo -->
  <symbol id="i-landing" viewBox="0 0 24 24">
    <use href="#i-rig"/>
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.8V11"/>
      <path d="M8.5 7.5 12 11l3.5-3.5"/>
    </g>
  </symbol>

  <!-- ADC: pista vista de cima com cota de distância -->
  <symbol id="i-adc" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6.5h18"/>
      <path d="M3 4.5v4M21 4.5v4"/>
      <rect x="2.5" y="11.5" width="19" height="8" rx="1.5"/>
      <path d="M6.5 15.5h2M11 15.5h2M15.5 15.5h2"/>
    </g>
  </symbol>
</svg>
